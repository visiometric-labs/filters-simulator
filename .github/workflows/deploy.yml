name: Deploy Production (main) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Checkout de la rama main de producción
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 3. Compilación de producción
      - name: Build Production Bundle
        run: |
          npm ci
          npx vite build --base=/filters-simulator/

      # 4. Subir artefacto compilado
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 5. Desplegar a GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
