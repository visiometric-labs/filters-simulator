name: Deploy Multi-Branch to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Checkout completo con todas las ramas
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 3. Compilación combinada de ambas ramas (main a la raíz, dev a /dev/)
      - name: Build Production (main) and Staging (dev)
        run: |
          set -e
          mkdir -p combined-dist

          echo "=== Compilando rama MAIN (Producción) ==="
          git checkout main
          npm ci
          npx vite build --base=/filters-simulator/
          cp -r dist/. combined-dist/

          echo "=== Compilando rama DEV (Pruebas Tablet) ==="
          git checkout dev
          npm ci
          npx vite build --base=/filters-simulator/dev/
          mkdir -p combined-dist/dev
          cp -r dist/. combined-dist/dev/

      # 4. Subir artefacto combinado
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './combined-dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 5. Desplegar a GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
