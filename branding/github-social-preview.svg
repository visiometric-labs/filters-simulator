<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Cyan to Royal Blue Gradient -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Amber Glow (Transitions) -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Purple Glow (Polarizado) -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Ambient Glow Spot -->
    <radialGradient id="spotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>

    <!-- Glass HUD Gradient -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- 2. Ambient Lighting Spots -->
  <circle cx="220" cy="280" r="380" fill="url(#spotGlow)" />
  <circle cx="980" cy="320" r="420" fill="url(#spotGlow)" opacity="0.6" />

  <!-- 3. Metrology Grid Lines in Background -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="640" stroke-dasharray="4 8" />
    <line x1="640" y1="0" x2="640" y2="640" stroke-dasharray="4 8" />
    <line x1="1200" y1="0" x2="1200" y2="640" stroke-dasharray="4 8" />
    <line x1="0" y1="160" x2="1280" y2="160" stroke-dasharray="4 8" />
    <line x1="0" y1="480" x2="1280" y2="480" stroke-dasharray="4 8" />
  </g>

  <!-- Precision Angular Dial (Top Right Background) -->
  <g opacity="0.25">
    <circle cx="1060" cy="220" r="260" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 8" />
    <circle cx="1060" cy="220" r="200" fill="none" stroke="#334155" stroke-width="1" />
  </g>

  <!-- ================= LEFT COLUMN: BRANDING & HEADLINE ================= -->
  <!-- Brand Overline Badge -->
  <g transform="translate(90, 95)">
    <rect width="280" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
    <circle cx="18" cy="15" r="4" fill="#38BDF8" filter="url(#glow)" />
    <text x="32" y="20" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">
      VISIOMETRIC LABS • JAYZIRTECH
    </text>
  </g>

  <!-- Main Title -->
  <text x="90" y="195" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Simulador de
  </text>
  <text x="90" y="255" fill="url(#cyanBlue)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1" filter="url(#glow)">
    Filtros Ópticos
  </text>

  <!-- Value Proposition Paragraph -->
  <text x="90" y="315" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" line-height="28">
    Demostración clínica y venta en primera persona (POV).
  </text>
  <text x="90" y="345" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Comprueba en tiempo real el corte de deslumbramiento, descanso digital y protección UV.
  </text>

  <!-- Clinical Feature Badges Grid -->
  <g transform="translate(90, 400)">
    <!-- Badge 1: Crizal -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(37, 99, 235, 0.6)" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#2563EB" />
      <text x="38" y="24" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">Crizal Multicapa 99.5%</text>
    </g>

    <!-- Badge 2: Blue Cut -->
    <g transform="translate(195, 0)">
      <rect width="170" height="38" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#38BDF8" />
      <text x="38" y="24" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">Blue Cut Confort 4.5K</text>
    </g>

    <!-- Badge 3: Transitions vs Trinity -->
    <g transform="translate(0, 52)">
      <rect width="225" height="38" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.6)" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#F59E0B" />
      <text x="38" y="24" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">Transitions vs. Trinity (Kinetics)</text>
    </g>

    <!-- Badge 4: Polarizado -->
    <g transform="translate(240, 52)">
      <rect width="160" height="38" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(139, 92, 246, 0.6)" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#8B5CF6" />
      <text x="38" y="24" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">Filtro Polarizado 360°</text>
    </g>
  </g>

  <!-- Tech Footnote -->
  <text x="90" y="555" fill="#475569" font-family="monospace" font-size="13">
    Vanilla ES6+ • HTML5 Canvas 2D • 60-144 FPS • WebGL Shader Calibrated
  </text>

  <!-- ================= RIGHT COLUMN: HIGH-TECH OPTICAL HUD MOCKUP ================= -->
  <g transform="translate(760, 130)">
    <!-- Glowing Outer Aura -->
    <circle cx="240" cy="190" r="170" fill="url(#spotGlow)" opacity="0.8" />

    <!-- Stylized Titanium HUD Glasses Frame -->
    <!-- Left Lens Rim -->
    <ellipse cx="140" cy="190" rx="100" ry="85" fill="rgba(15, 23, 42, 0.6)" stroke="url(#glassRim)" stroke-width="5" />
    <!-- Left Lens Glass (Clear with Cyan Anti-Reflective Glint) -->
    <ellipse cx="140" cy="190" rx="93" ry="78" fill="rgba(56, 189, 248, 0.06)" />
    <!-- Anti-reflective highlight arc -->
    <path d="M 75 160 A 90 75 0 0 1 195 140" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.6" filter="url(#glow)" />

    <!-- Center Bridge -->
    <path d="M 235 180 Q 240 160 245 180" fill="none" stroke="url(#glassRim)" stroke-width="6" stroke-linecap="round" />

    <!-- Right Lens Rim (Treated with Dark Sun / Polarized / Transitions) -->
    <ellipse cx="340" cy="190" rx="100" ry="85" fill="rgba(15, 23, 42, 0.85)" stroke="url(#glassRim)" stroke-width="5" />
    <!-- Right Lens Glass (Graphite Solar Tint) -->
    <ellipse cx="340" cy="190" rx="93" ry="78" fill="rgba(38, 48, 62, 0.72)" />
    <ellipse cx="340" cy="190" rx="93" ry="78" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />

    <!-- Central Optical Wavefront Metrology Core ("V") -->
    <g transform="translate(240, 190) scale(0.65)" filter="url(#glow)">
      <path d="M -90 -60 L 0 90 L 90 -60 L 60 -60 L 0 50 L -60 -60 Z" fill="url(#cyanBlue)" />
      <path d="M -45 -60 L 0 25 L 45 -60 L 25 -60 L 0 -15 L -25 -60 Z" fill="#FFFFFF" opacity="0.9" />
      <circle cx="0" cy="50" r="6" fill="#38BDF8" />
    </g>

    <!-- Interactive POV HUD Labels -->
    <g transform="translate(60, 310)">
      <rect width="160" height="24" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="80" y="16" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">
        👁️ VISIÓN PERIFÉRICA
      </text>
    </g>

    <g transform="translate(260, 310)">
      <rect width="160" height="24" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1" />
      <text x="80" y="16" fill="#F59E0B" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">
        🕶️ CRISTAL TRATADO (POV)
      </text>
    </g>
  </g>

  <!-- Top Right Discreet Corner Badge -->
  <g transform="translate(1080, 40)">
    <text x="110" y="20" fill="#475569" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="end">
      GITHUB REPO PREVIEW
    </text>
  </g>
</svg>