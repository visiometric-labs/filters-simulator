<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#03060A" />
    </radialGradient>

    <!-- Cyan to Royal Blue Main Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Electric Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>

    <!-- Prismatic Accent Gradient -->
    <linearGradient id="prismGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter for Vector Elements -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- 2. Ambient Focal Glow -->
  <circle cx="256" cy="245" r="190" fill="url(#coreGlow)" />

  <!-- 3. Metrology Reticle (Precision Optical Coordinate Ring) -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="256" cy="256" r="206" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4" />

  <!-- Reticle Cardinal & Degree Ticks -->
  <g stroke="#38BDF8" stroke-width="2" opacity="0.45">
    <!-- Top / Bottom / Left / Right Axis Marks -->
    <line x1="256" y1="36" x2="256" y2="48" />
    <line x1="256" y1="464" x2="256" y2="476" />
    <line x1="36" y1="256" x2="48" y2="256" />
    <line x1="464" y1="256" x2="476" y2="256" />

    <!-- 45 Degree Diagonal Marks -->
    <line x1="100" y1="100" x2="108" y2="108" />
    <line x1="412" y1="100" x2="404" y2="108" />
    <line x1="100" y1="412" x2="108" y2="404" />
    <line x1="412" y1="412" x2="404" y2="404" />
  </g>

  <!-- 4. Prismatic Refraction Arc (Subtle Spectrum Beam) -->
  <path d="M 120 190 Q 256 120 392 190" fill="none" stroke="url(#prismGrad)" stroke-width="3" stroke-linecap="round" opacity="0.45" />

  <!-- 5. Geometric "V" + Twin Lenses Silhouette -->
  <!-- Left Optical Lens Rim -->
  <path d="M 145 200 C 145 145, 205 145, 240 185 C 215 220, 175 240, 150 225 C 146 217, 145 209, 145 200 Z"
        fill="rgba(56, 189, 248, 0.08)" stroke="#38BDF8" stroke-width="3.5" filter="url(#neonGlow)" />

  <!-- Right Optical Lens Rim -->
  <path d="M 367 200 C 367 145, 307 145, 272 185 C 297 220, 337 240, 362 225 C 366 217, 367 209, 367 200 Z"
        fill="rgba(56, 189, 248, 0.08)" stroke="#38BDF8" stroke-width="3.5" filter="url(#neonGlow)" />

  <!-- Central Dynamic "V" Wavefront Chevron (High Precision Metrology Core) -->
  <g filter="url(#neonGlow)">
    <!-- Outer Shield / Prism Arms -->
    <path d="M 108 175 L 256 395 L 404 175 L 362 175 L 256 332 L 150 175 Z"
          fill="url(#primaryGrad)" />

    <!-- Inner Core Razor V -->
    <path d="M 172 175 L 256 300 L 340 175 L 308 175 L 256 252 L 204 175 Z"
          fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- 6. Optical Focus Beam & Focal Flare Node -->
  <circle cx="256" cy="335" r="9" fill="#FFFFFF" filter="url(#neonGlow)" />
  <circle cx="256" cy="335" r="4" fill="#38BDF8" />

  <!-- Horizontal Axis Beam through Focal Node -->
  <line x1="210" y1="335" x2="302" y2="335" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

  <!-- 7. Subtle Metrology Coordinate Dot Matrix -->
  <circle cx="256" cy="120" r="3" fill="#38BDF8" opacity="0.8" />
  <circle cx="236" cy="120" r="1.5" fill="#38BDF8" opacity="0.4" />
  <circle cx="276" cy="120" r="1.5" fill="#38BDF8" opacity="0.4" />
</svg>