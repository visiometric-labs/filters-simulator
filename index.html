<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👓 Visiometric | Experiencia Óptica POV</title>
  <meta name="description" content="Demostración clínica interactiva en primera persona de tratamientos oftálmicos: Antirreflejo Verde vs Crizal Multicapa, Blue Cut y Transitions en cabina 2K.">
  
  <!-- Favicons Profesionales (Vectorial SVG + PNG) -->
  <link rel="icon" type="image/svg+xml" href="./branding/favicon-opt1.svg">
  <link rel="alternate icon" type="image/png" href="./branding/favicon-opt1.png">
  <link rel="apple-touch-icon" href="./branding/apple-touch-icon.png">

  <!-- Integración Móvil & Barra de Navegador Nativa (theme-color) -->
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Visiometric">
  <link rel="manifest" href="./manifest.json">

  <!-- Portada y Metadatos para WhatsApp y Redes Sociales (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Visiometric Labs">
  <meta property="og:title" content="Visiometric Labs — Experiencia Óptica en Primera Persona">
  <meta property="og:description" content="Simulación interactiva de tratamientos oftálmicos de alta gama: Antirreflejo Verde vs Crizal Multicapa, Blue Cut y Transitions en cabina 2K.">
  <meta property="og:image" content="https://visiometric-labs.github.io/filters-simulator/branding/og-cover-opt1.jpg">
  <meta property="og:image:secure_url" content="https://visiometric-labs.github.io/filters-simulator/branding/og-cover-opt1.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://visiometric-labs.github.io/filters-simulator/">

  <!-- Tarjeta Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Visiometric Labs — Experiencia Óptica en Primera Persona">
  <meta name="twitter:description" content="Demostración interactiva de tratamientos oftálmicos: Antirreflejo Verde vs Crizal Multicapa, Blue Cut y Transitions en cabina 2K.">
  <meta name="twitter:image" content="https://visiometric-labs.github.io/filters-simulator/branding/og-cover-opt1.jpg">

  <!-- Tipografía Amigable y Médica -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./src/styles/theme.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
  <link rel="stylesheet" href="./src/styles/components.css">
</head>
<body>
  <!-- Preloader Clínico Suave -->
  <div id="clinic-preloader" class="clinic-preloader">
    <div class="preloader-icon-pulse">
      <img src="./branding/favicon-opt1.svg" alt="Visiometric Logo">
    </div>
    <div class="preloader-text">Iniciando Óptica 2K</div>
    <div class="preloader-subtext">Calibrando simulación en primera persona...</div>
  </div>

  <div id="app">
    <!-- Header Clínico Amigable -->
    <header class="clinic-header">
      <div class="brand-section">
        <div class="brand-icon-wrapper">
          <span>👓</span>
        </div>
        <div class="brand-texts">
          <h1>
            <span>Visiometric Labs</span>
            <span class="brand-badge">Experiencia Óptica</span>
          </h1>
          <p>Visión en primera persona para consulta y mostrador</p>
        </div>
      </div>

      <!-- Selector de Escenas (Header central) -->
      <div id="scene-selector-container"></div>

      <!-- Acciones del Header -->
      <div class="header-actions">
        <button type="button" class="btn-clinic-action" id="btn-toggle-info" title="Mostrar/ocultar información del lente">
          <span>💡</span> <span class="action-text">Beneficios</span>
        </button>
        <button type="button" class="btn-clinic-action" id="btn-fullscreen" title="Pantalla completa para tablet">
          <span>⛶</span>
        </button>
      </div>
    </header>

    <!-- Área de la Simulación POV (Primera Persona) -->
    <main class="sim-viewport-container" id="sim-viewport">
      <!-- Canvas interactivo continuo 360 -->
      <canvas id="sim-canvas"></canvas>

      <!-- Sello Discreto de Marca de Agua -->
      <div class="clinic-watermark">
        <span class="watermark-dot"></span>
        <span>Visiometric Labs — JayzirTech</span>
      </div>

      <!-- Capa de la Montura Oftálmica (HUD POV) -->
      <div id="glasses-container"></div>

      <!-- Indicador amigable para girar la cabeza -->
      <div class="look-hint-overlay" id="look-hint">
        <span>🕹️</span>
        <span>Usa el joystick o arrastra la pantalla para girar la cabeza</span>
      </div>

      <!-- Botón para alternar Con Lentes / Sin Lentes -->
      <button type="button" class="btn-toggle-glasses" id="btn-toggle-glasses" title="Alternar visión con o sin gafas">
        <span class="status-dot"></span>
        <span id="glasses-toggle-label">Ver sin Gafas</span>
      </button>

      <!-- Tarjeta Flotante de Experiencia del Paciente -->
      <div class="patient-card-anchor" id="patient-card-container"></div>

      <!-- Barra Inferior de Controles -->
      <div class="bottom-controls-bar">
        <!-- Zona del Joystick Virtual -->
        <div class="joystick-zone">
          <div id="joystick-container"></div>
          <span class="joystick-caption">Girar Cabeza</span>
        </div>

        <!-- Zona del Selector de Lentes -->
        <div class="lens-selector-zone">
          <div id="lens-selector-container"></div>
        </div>

        <!-- Zona del Slider UV (Transitions) -->
        <div class="slider-uv-zone" id="uv-slider-container"></div>
      </div>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
